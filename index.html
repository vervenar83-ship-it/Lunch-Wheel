<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비례 면적 점심 룰렛</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        p {
            color: #7f8c8d;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .input-group {
            display: flex;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px 0 0 6px;
            outline: none;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            border: none;
            background-color: #3498db;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 0 6px 6px 0;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .canvas-container {
            position: relative;
            margin: 20px auto;
            width: 300px;
            height: 300px;
        }
        #canvas {
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #e74c3c;
            z-index: 10;
        }
        #spinBtn {
            border-radius: 6px;
            width: 100%;
            background-color: #2ecc71;
            font-weight: bold;
            font-size: 18px;
            margin-top: 10px;
        }
        #spinBtn:hover {
            background-color: #27ae60;
        }
        .menu-list {
            text-align: left;
            margin-top: 20px;
            max-height: 150px;
            overflow-y: auto;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #f9f9f9;
        }
        .menu-name {
            font-weight: 500;
        }
        .menu-count {
            background: #e1f5fe;
            color: #0288d1;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 14px;
        }
        #result {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #e74c3c;
            min-height: 30px;
        }
    </style>
</head>
<body>

    <h1>점심 메뉴 결정 룰렛</h1>
    <p>표 수가 많을수록 룰렛의 면적이 넓어집니다.</p>

    <div class="container">
        <div class="input-group">
            <!-- 온인풋을 이용해 공백 입력을 원천 차단합니다 -->
            <input type="text" id="menuInput" placeholder="메뉴 입력 (공백 불가능)" oninput="this.value = this.value.replace(/\s/g, '')">
            <button onclick="addMenu()">추가</button>
        </div>

        <div class="canvas-container">
            <div class="pointer"></div>
            <canvas id="canvas" width="300" height="300"></canvas>
        </div>

        <button id="spinBtn" onclick="spin()">룰렛 돌리기!</button>
        <div id="result"></div>

        <div class="menu-list" id="menuList">
            <!-- 메뉴 목록이 여기에 동적으로 추가됩니다 -->
        </div>
    </div>

    <script>
        // 간단한 동의어 사전 매핑 데이터베이스
        const dictionary = {
            '돈가스': ['돈까스', '돈카츠', '치즈돈까스', '치즈돈가스'],
            '라면': ['라멘', '신라면', '컵라면'],
            '에스프레소': ['에쏘', '아메리카노', '커피']
        };

        let menuData = [];
        const colors = ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7', '#a29bfe', '#fd79a8', '#fab1a0', '#00cec9'];

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let currentAngle = 0;
        let isSpinning = false;

        // 동의어 체크 후 대표 단어 반환하는 함수
        function getRepresentativeMenu(name) {
            for (const [key, synonyms] of Object.entries(dictionary)) {
                if (key === name || synonyms.includes(name)) {
                    return key; // 사전의 대표 단어로 통합
                }
            }
            return name; // 사전에 없으면 입력한 그대로 사용 (로컬 룰)
        }

        function drawRoulette() {
            const totalVotes = menuData.reduce((sum, item) => sum + item.count, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (totalVotes === 0) {
                // 데이터가 없을 때 기본 가이드 선 그리기
                ctx.beginPath();
                ctx.arc(150, 150, 140, 0, 2 * Math.PI);
                ctx.fillStyle = '#dfe6e9';
                ctx.fill();
                ctx.fillStyle = '#b2bec3';
                ctx.font = '16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('메뉴를 추가해 주세요', 150, 155);
                return;
            }

            let startAngle = currentAngle;

            menuData.forEach((item, index) => {
                // 투표 수 비율에 맞춰서 각도 할당 (비례 면적 핵심 로직)
                const sliceAngle = (item.count / totalVotes) * 2 * Math.PI;
                
                ctx.beginPath();
                ctx.moveTo(150, 150);
                ctx.arc(150, 150, 140, startAngle, startAngle + sliceAngle);
                ctx.closePath();
                
                ctx.fillStyle = colors[index % colors.length];
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 텍스트 그리기
                ctx.save();
                ctx.translate(150, 150);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#2c3e50';
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText(item.name, 120, 5);
                ctx.restore();

                startAngle += sliceAngle;
            });
        }

        function addMenu() {
            const input = document.getElementById('menuInput');
            let name = input.value.trim();
            if (!name) return;

            // 사전 기반 동의어 처리 통합
            name = getRepresentativeMenu(name);

            // 동일 메뉴가 이미 존재하는지 체크
            const existingItem = menuData.find(item => item.name === name);
            if (existingItem) {
                existingItem.count++; // 면적 증가
            } else {
                menuData.push({ name: name, count: 1 }); // 새 메뉴 한 칸 차지
            }

            input.value = '';
            updateMenuList();
            drawRoulette();
        }

        function updateMenuList() {
            const listDiv = document.getElementById('menuList');
            listDiv.innerHTML = '';
            menuData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'menu-item';
                div.innerHTML = `<span class="menu-name">${item.name}</span><span class="menu-count">${item.count}표</span>`;
                listDiv.appendChild(div);
            });
        }

        function spin() {
            if (isSpinning || menuData.length === 0) return;
            isSpinning = true;
            document.getElementById('result').innerText = '고르는 중...';

            const totalVotes = menuData.reduce((sum, item) => sum + item.count, 0);
            const spinAngle = Math.random() * 2 * Math.PI + 4 * Math.PI; // 최소 2바퀴 이상 회전
            let duration = 3000;
            let startTime = null;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // 감속 애니메이션 효과 (Ease-out)
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentAngle = easeOut * spinAngle;

                drawRoulette();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    determineWinner(totalVotes);
                }
            }
            requestAnimationFrame(animate);
        }

        function determineWinner(totalVotes) {
            // 화살표가 가리키는 곳(상단 정중앙 = 1.5 * Math.PI 선상)의 각도 계산
            let normalizedAngle = (1.5 * Math.PI - currentAngle) % (2 * Math.PI);
            if (normalizedAngle < 0) normalizedAngle += 2 * Math.PI;

            let startAngle = 0;
            let winner = '선택 실패';

            for (let item of menuData) {
                const sliceAngle = (item.count / totalVotes) * 2 * Math.PI;
                if (normalizedAngle >= startAngle && normalizedAngle < startAngle + sliceAngle) {
                    winner = item.name;
                    break;
                }
                startAngle += sliceAngle;
            }

            document.getElementById('result').innerText = `오늘 점심은: ${winner}!`;
        }

        // 초기 화면 그리기
        drawRoulette();
    </script>
</body>
</html>
