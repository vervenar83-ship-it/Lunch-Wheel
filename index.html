<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>점심 룰렛</title>
</head>
<body>
    <h1>점심 룰렛</h1>
    <div id="status" style="color: red;">로딩 중...</div>
    <br>
    <input type="text" id="menuInput" placeholder="메뉴 입력">
    <button id="addBtn">추가</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCZ1mXpEhfw2Wovpck6BHvIp6aMmq2Kg8",
            authDomain: "lunch-wheel-3e5ae.firebaseapp.com",
            projectId: "lunch-wheel-3e5ae",
            storageBucket: "lunch-wheel-3e5ae.firebasestorage.app",
            messagingSenderId: "2842226690",
            appId: "1:2842226690:web:849445afa6f938d1fdf71b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const dbRef = collection(db, "rooms", "default", "menus");

        // 로딩 완료 표시
        document.getElementById('status').innerText = "준비 완료!";
        document.getElementById('status').style.color = "green";

        document.getElementById('addBtn').addEventListener('click', async () => {
            const input = document.getElementById('menuInput');
            const name = input.value.trim();
            if (!name) return alert("입력값이 없습니다.");
            
            try {
                await addDoc(dbRef, { name: name });
                alert("추가 성공!");
                input.value = '';
            } catch (e) {
                alert("에러 발생: " + e.message);
            }
        });
    </script>
</body>
</html>
