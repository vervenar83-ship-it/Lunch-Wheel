<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실시간 점심 룰렛</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #canvas { margin-top: 20px; border: 2px solid #333; border-radius: 50%; }
    </style>
</head>
<body>
    <h1>실시간 점심 룰렛</h1>
    <input type="text" id="menuInput" placeholder="메뉴 입력">
    <button onclick="addMenu()">추가</button>
    <br><canvas id="canvas" width="300" height="300"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCZ1mXpEhfw2Wovpck6BHvIp6aMmq2Kg8",
            authDomain: "lunch-wheel-3e5ae.firebaseapp.com",
            projectId: "lunch-wheel-3e5ae",
            storageBucket: "lunch-wheel-3e5ae.firebasestorage.app",
            messagingSenderId: "2842226690",
            appId: "1:2842226690:web:849445afa6f938d1fdf71b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let menus = [];

        window.addMenu = async () => {
            const input = document.getElementById('menuInput');
            if (input.value) {
                await addDoc(collection(db, "menus"), { name: input.value });
                input.value = '';
            }
        };

        onSnapshot(collection(db, "menus"), (snapshot) => {
            menus = snapshot.docs.map(doc => doc.data().name);
            draw();
        });

        function draw() {
            ctx.clearRect(0, 0, 300, 300);
            menus.forEach((m, i) => {
                let angle = (2 * Math.PI / menus.length) * i;
                ctx.beginPath();
                ctx.moveTo(150, 150);
                ctx.arc(150, 150, 150, angle, angle + (2 * Math.PI / menus.length));
                ctx.fillStyle = i % 2 ? '#ff9999' : '#99ff99';
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#000';
                ctx.fillText(m, 150 + Math.cos(angle + 0.2) * 80, 150 + Math.sin(angle + 0.2) * 80);
            });
        }
    </script>
</body>
</html>
