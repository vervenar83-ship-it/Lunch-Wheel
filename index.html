<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>점심 룰렛</title>
    <style>
        /* 캔버스 테두리를 제거하여 깔끔하게 만듭니다 */
        #roulette { display: block; margin: 20px 0; }
        /* 룰렛을 감싸는 컨테이너에 회전 애니메이션 적용 */
        #container { display: inline-block; }
    </style>
</head>
<body>
    <input type="text" id="menuInput" placeholder="메뉴 입력">
    <button onclick="addMenu()">추가</button>
    <button onclick="resetRoulette()">새 룰렛 만들기</button>
    <button onclick="shareLink()">공유하기</button>
    <br>
    <div id="container">
        <canvas id="roulette" width="400" height="400"></canvas>
    </div>
    <br>
    <button onclick="spin()">룰렛 돌리기</button>

    <script>
        let menuCounts = {};
        const canvas = document.getElementById('roulette');
        const container = document.getElementById('container');
        const ctx = canvas.getContext('2d');

        function addMenu() {
            const input = document.getElementById('menuInput');
            const name = input.value.trim();
            if (name) {
                menuCounts[name] = (menuCounts[name] || 0) + 1;
                input.value = '';
                draw();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, 400, 400);
            const keys = Object.keys(menuCounts);
            if (keys.length === 0) return;

            const total = Object.values(menuCounts).reduce((a, b) => a + b, 0);
            let currentAngle = 0;

            keys.forEach((menu, i) => {
                const sliceAngle = (menuCounts[menu] / total) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(200, 200);
                ctx.fillStyle = `hsl(${i * 360 / keys.length}, 70%, 70%)`;
                ctx.arc(200, 200, 200, currentAngle, currentAngle + sliceAngle);
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.translate(200, 200);
                ctx.rotate(currentAngle + sliceAngle / 2);
                ctx.fillStyle = '#000';
                ctx.font = '14px Arial';
                ctx.fillText(`${menu} (${menuCounts[menu]})`, 80, 5);
                ctx.restore();
                currentAngle += sliceAngle;
            });
        }

        function spin() {
            const rotation = Math.random() * 360 + 720;
            container.style.transition = 'transform 3s ease-out';
            container.style.transform = `rotate(${rotation}deg)`;
        }

        function resetRoulette() {
            menuCounts = {};
            container.style.transition = 'none';
            container.style.transform = 'rotate(0deg)';
            draw();
        }

        function shareLink() {
            const data = btoa(JSON.stringify(menuCounts));
            const url = window.location.origin + window.location.pathname + '?data=' + data;
            navigator.clipboard.writeText(url).then(() => alert('링크가 복사되었습니다.'));
        }

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            if (params.has('data')) {
                try {
                    menuCounts = JSON.parse(atob(params.get('data')));
                    draw();
                } catch(e) { console.error(e); }
            }
        };
    </script>
</body>
</html>
