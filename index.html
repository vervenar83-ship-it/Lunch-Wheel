<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>점심 룰렛</title>
    <style>
        canvas { border: 1px solid #000; cursor: pointer; display: block; margin: 20px 0; }
    </style>
</head>
<body>
    <input type="text" id="menuInput" placeholder="메뉴 입력">
    <button onclick="addMenu()">추가</button>
    <button onclick="resetRoulette()">새 룰렛 만들기</button>
    <button onclick="shareLink()">공유하기</button>
    <br>
    <canvas id="roulette" width="400" height="400"></canvas>
    <button onclick="spin()">룰렛 돌리기</button>

    <script>
        let menus = [];
        const canvas = document.getElementById('roulette');
        const ctx = canvas.getContext('2d');

        function addMenu() {
            const input = document.getElementById('menuInput');
            if (input.value) {
                menus.push(input.value);
                input.value = '';
                draw();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, 400, 400);
            if (menus.length === 0) return;
            const arc = Math.PI * 2 / menus.length;
            menus.forEach((menu, i) => {
                const angle = i * arc;
                ctx.beginPath();
                ctx.fillStyle = `hsl(${i * 360 / menus.length}, 70%, 70%)`;
                ctx.moveTo(200, 200);
                ctx.arc(200, 200, 200, angle, angle + arc);
                ctx.fill();
                ctx.stroke();
                ctx.save();
                ctx.translate(200, 200);
                ctx.rotate(angle + arc / 2);
                ctx.fillStyle = '#000';
                ctx.font = '16px Arial';
                ctx.fillText(menu, 100, 10);
                ctx.restore();
            });
        }

        function spin() {
            const rotation = Math.random() * 360 + 720;
            canvas.style.transition = 'transform 3s ease-out';
            canvas.style.transform = `rotate(${rotation}deg)`;
        }

        function resetRoulette() {
            menus = [];
            canvas.style.transform = 'rotate(0deg)';
            draw();
        }

        function shareLink() {
            const data = btoa(JSON.stringify(menus));
            const url = window.location.origin + window.location.pathname + '?data=' + data;
            navigator.clipboard.writeText(url).then(() => alert('링크가 복사되었습니다.'));
        }
    </script>
</body>
</html>
